<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Health">
  <title>Sign in · Health Tracker</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=2">
  <link rel="icon" href="/static/favicon-32.png?v=2" type="image/png" sizes="32x32">
  <script>
    // Apply the saved theme before first paint (dark by default; "auto" follows the phone).
    (function () {
      var t = "dark";
      try { t = localStorage.getItem("theme") || "dark"; } catch (e) {}
      if (t === "auto") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      if (t === "light") document.documentElement.setAttribute("data-theme", "light");
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", t === "light" ? "#f3f5f8" : "#0b0f14");
    })();
  </script>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .login { width: min(360px, 100%); }
    .login img { width: 64px; height: 64px; display: block; margin-bottom: 12px; }
    .login h1 { font-size: 20px; margin: 0 0 4px; }
    #err { color: var(--bad); min-height: 1.2em; margin: 0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <form class="card form login" id="loginForm">
      <img src="/static/logo-mark.png?v=2" alt="Health Tracker logo">
      <h1>Health Tracker</h1>
      <p class="muted small" style="margin:0">Enter your app password to continue.</p>
      <label>Password <input type="password" name="password" autocomplete="current-password" required autofocus></label>
      <p id="err" role="alert"></p>
      <button type="submit">Sign in</button>
    </form>
  </div>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector("button");
      btn.disabled = true;
      document.getElementById("err").textContent = "";
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: e.target.password.value }),
        });
        if (res.ok) return location.replace("/");
        const j = await res.json().catch(() => ({}));
        document.getElementById("err").textContent = j.detail || "Sign-in failed";
      } catch {
        document.getElementById("err").textContent = "Can't reach the server. Check your connection.";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
